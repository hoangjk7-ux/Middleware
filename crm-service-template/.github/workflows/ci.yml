name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2

    - name: Install deps
      run: composer install

    - name: Run test
      run: php artisan test || true

    - name: Build Docker
      run: docker build -t ${{ github.repository }} .

    - name: Login DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker
      run: |
        docker tag ${{ github.repository }} yourdockerhub/${{ github.event.repository.name }}:latest
        docker push yourdockerhub/${{ github.event.repository.name }}:latest